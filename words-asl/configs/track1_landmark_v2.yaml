# Track 1 v2 — landmark model on a pruned 48-keypoint subset.
#
# Drops the 27 keypoints we identified as low-value for word-level signs:
#   - 11 head keypoints (nose, eyes, ears, mouth corners)
#   - 2 hip keypoints
#   - 8 lower-body keypoints (knees, ankles, heels, foot indices)
#   - 6 pose-level coarse hand landmarks (redundant with the full hand mesh)
#
# Kept:
#   - 6 upper-body anchors (L/R shoulder, elbow, wrist)
#   - 21 left-hand mesh
#   - 21 right-hand mesh
# Total: 48
#
# Same dataset (wlasl9idle, 9 classes including idle), same augmentation,
# same architecture knobs as the v1 9-class config — only num_keypoints +
# keypoint_subset differ. This isolates the effect of pruning irrelevant
# input dimensions.

track: track1
dataset_name: wlasl9idle_v2

dataset:
  name: landmark
  train_args:
    manifest_path: wlasl/prepared/wlasl9idle_train.json
    landmarks_root: landmarks_cache
    num_frames: 32
    sampling: random
    normalise: true
    augment: true
    keypoint_subset: upper_body_hands
    seed: 0
  val_args:
    manifest_path: wlasl/prepared/wlasl9idle_val.json
    landmarks_root: landmarks_cache
    num_frames: 32
    sampling: uniform
    normalise: true
    augment: false
    keypoint_subset: upper_body_hands
    seed: 0

model:
  name: landmark_classifier
  args:
    num_classes: 9
    num_keypoints: 48
    coord_dims: 3
    d_model: 128
    nhead: 4
    num_layers: 2
    dim_feedforward: 256
    dropout: 0.2
    max_frames: 64
    pool: mean

training:
  device: auto
  seed: 0
  epochs: 120
  batch_size: 16
  num_workers: 2
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 6
  grad_clip: 1.0
  amp: true
  out_dir: checkpoints
  class_weights: auto

logging:
  project: ml-final-signreader
  tags: [track1, wlasl9idle, transformer, augmented, v2_keypoints48]

distillation:
  enabled: false
