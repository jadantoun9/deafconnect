# XcodeGen spec — generates SignReader.xcodeproj deterministically.
#
# Why XcodeGen rather than committing the .xcodeproj file:
#   - .xcodeproj contains absolute paths and UUIDs that churn on every Xcode open.
#     Generated specs keep diffs reviewable.
#   - One source of truth for build settings; no hidden Xcode UI state.
#
# How to use:
#   brew install xcodegen
#   cd ios-app && xcodegen generate
#   open SignReader.xcodeproj
#
# Deployment target is iOS 17.0 — needed for SwiftData (used by the chat /
# transcript / shortcut persistence layer) and for the modern SwiftUI APIs in
# the deafconnect port (PhotosPicker, refined ScrollView, etc.).

name: SignReader
options:
  bundleIdPrefix: com.jadantoun.signreader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # GLTFKit2 renders the rigged .glb avatars (boy/girl) ported from
  # deafconnect. SwiftUI/SceneKit don't support glTF natively; converting to
  # USDZ tends to break rigged animations.
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    branch: master

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # owner: fill in your Apple developer team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  SignReader:
    type: application
    platform: iOS
    dependencies:
      - package: GLTFKit2
        product: GLTFKit2
    sources:
      - path: SignReader
        excludes:
          - "Resources/**"
      # Core ML packages live alongside Swift sources but are referenced as
      # resources so Xcode compiles them to .mlmodelc at build time. Listed
      # explicitly with `type: file` so XcodeGen doesn't walk into the
      # .mlpackage directory.
      - path: SignReader/Resources/SanityModel.mlpackage
        type: file
        optional: true
        buildPhase: resources
      # Resource directories ported from deafconnect.
      - path: SignReader/Resources/Avatars
        type: folder
        optional: true
        buildPhase: resources
      - path: SignReader/Resources/WLASLClasses.json
        type: file
        optional: true
        buildPhase: resources
      # Track 1 9-class landmark model + its label list. Generated by
      # research/deploy/convert_to_coreml.py from the best.pt checkpoint
      # of track1-wlasl9idle-s0. Drop in updated copies of either file
      # to swap models without code changes.
      - path: SignReader/Resources/LandmarkClassifier9.mlpackage
        type: file
        optional: true
        buildPhase: resources
      - path: SignReader/Resources/LandmarkClasses9.json
        type: file
        optional: true
        buildPhase: resources
      # v2 landmark model — pruned 48-keypoint variant trained from
      # track1-wlasl9idle_v2-s0 (val_top1 ≈ 0.80 vs v1's 0.65). Same
      # output schema (classLabel + classLabel_probs); the only thing the
      # Swift side changes is the input slicing 75->48 before inference.
      - path: SignReader/Resources/LandmarkClassifier9V2.mlpackage
        type: file
        optional: true
        buildPhase: resources
      # MediaPipe Holistic Landmarker — provides the 33 pose + 21 + 21
      # hand keypoints the Track 1 model was trained against. Bundled
      # via Resources so the LandmarkExtractor can locate it via
      # `Bundle.main.path(forResource:ofType:)`. The pod itself is
      # added through the Podfile alongside this project.yml; remember
      # to open SignReader.xcworkspace, not .xcodeproj.
      - path: SignReader/Resources/holistic_landmarker.task
        type: file
        optional: true
        buildPhase: resources
      # Track 2 baseline (video transformer): ViT-Small + 3-layer
      # temporal Transformer, 8 classes (drink/go/help/who/yes/no/
      # before/walk). FP16 ~48 MB. Bundled alongside Track 1 so the
      # Sign-to-Text picker can swap between landmark and video models.
      - path: SignReader/Resources/VideoClassifier8.mlpackage
        type: file
        optional: true
        buildPhase: resources
      - path: SignReader/Resources/VideoClasses8.json
        type: file
        optional: true
        buildPhase: resources
      # ASL alphabet (A..Z) classifier — ResNet-landmarks model ported
      # from Sign Language Python/results/resnet_landmarks_model.h5 via
      # src/letters/convert_to_coreml.py. Input [1,21,3] hand keypoints;
      # ClassifierConfig emits classLabel + classLabel_probs over A..Z.
      - path: SignReader/Resources/LetterClassifier26.mlpackage
        type: file
        optional: true
        buildPhase: resources
    info:
      path: SignReader/Info.plist
      # NOTE: Info.plist is *generated* by XcodeGen from this block on every
      # `xcodegen generate` and is therefore gitignored. Edit values here.
      properties:
        CFBundleDisplayName: DeafConnect
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: SignReader needs the camera to recognize signs in real time.
        NSMicrophoneUsageDescription: SignReader needs the microphone for speech-to-text dictation in chat.
        NSSpeechRecognitionUsageDescription: SignReader uses on-device speech recognition to convert your voice into chat text.
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jadantoun.signreader
        INFOPLIST_FILE: SignReader/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
